<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZON LIVE 1</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --error: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
      text-align: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 24px;
      color: var(--text-sub);
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      margin-top: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.88rem;
      margin-top: 12px;
      display: none;
    }

    #player-section {
      display: none;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- PANTALLA DE CONTRASEÑA -->
    <div id="login-section">
      <div class="logo">DZON LIVE 1</div>
      <h1>Acceso privado al directo</h1>

      <div class="input-group">
        <label for="access-key">Código / Contraseña de acceso</label>
        <input type="password" id="access-key" placeholder="Introduce tu clave aquí...">
      </div>

      <button class="btn" onclick="checkAccess()">Entrar al directo</button>

      <div id="error-msg" class="error-msg">Código de acceso incorrecto.</div>
    </div>

    <!-- PANTALLA DEL REPRODUCTOR M3U8 EMBEDDED -->
    <div id="player-section">
      <div class="live-badge">
        <span class="live-dot"></span> EN DIRECTO
      </div>
      <div class="logo">DZON LIVE 1</div>

      <div class="player-container">
        <iframe id="stream-frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>

  </div>

  <script>
    const CLAVES_VALIDAS = ["107mael"];
    // URL del reproductor proxy para saltarse el bloqueo HTTPS/HTTP de navegadores
    const STREAM_URL = "http://181.78.197.59:8000/play/a07z/index.m3u8";

    function checkAccess() {
      const userKey = document.getElementById("access-key").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const loginSection = document.getElementById("login-section");
      const playerSection = document.getElementById("player-section");

      if (CLAVES_VALIDAS.includes(userKey)) {
        errorMsg.style.display = "none";
        loginSection.style.display = "none";
        playerSection.style.display = "block";
        
        // Carga el directo a través del reproductor web puente
        document.getElementById("stream-frame").src = "https://playertest.longtailvideo.com/adaptive/bipbop/bipbopall.html?file=" + encodeURIComponent(STREAM_URL);
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>

</body>
</html>
